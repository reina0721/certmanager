services:
  certmate:
    image: "${CERTMATE_IMAGE:-certmate:local}"
    container_name: "${CERTMATE_CONTAINER_NAME:-certmate}"
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - "${DATA_HOST_DIR:-./data}:/data"
      - "${CERTS_HOST_DIR:-./certs}:/certs"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/certmate", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
